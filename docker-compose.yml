version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: church-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    networks:
      - church-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Admin Frontend
  admin-frontend:
    build:
      context: ./church-admin-frontend
      dockerfile: Dockerfile
    container_name: church-admin-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - church-network
    depends_on:
      - backend

  # User Frontend
  user-frontend:
    build:
      context: ./church-user-frontend
      dockerfile: Dockerfile
    container_name: church-user-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - church-network
    depends_on:
      - backend

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: church-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-changeme}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-church_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - church-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  church-network:
    driver: bridge
